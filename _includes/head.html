<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ include.title }}</title>
<meta name="description" content="{{ include.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">
<meta name="theme-color" content="#0b1220">
<link rel="canonical" href="{{ include.url }}">
<link rel="alternate" type="text/calendar" title="台灣資安活動截止日 (iCal)" href="{{ site.baseurl }}/ical/deadlines-all.ical">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Taiwan Security Deadlines">
<meta property="og:title" content="{{ include.title }}">
<meta property="og:description" content="{{ include.description | default: site.description }}">
<meta property="og:url" content="{{ include.url }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/static/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="台灣資安競賽・課程報名時間總整理">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{ site.twitter_username }}">
<meta name="twitter:title" content="{{ include.title }}">
<meta name="twitter:description" content="{{ include.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/static/img/og.png">

<link rel="icon" type="image/png" href="{{ site.baseurl }}/static/img/favicon.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/static/img/favicon.png">
<link rel="stylesheet" href="{{ site.baseurl }}/static/css/deadlines.css?v={{ site.time | date: '%s' }}">
